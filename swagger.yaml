                url: https://api.weather.com/v2/current
                timeout: 5
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Tool updated
          content:
            application/json:
              schema:
                type: object
        '500':
          $ref: '#/components/responses/ServerError'

  /api/tool/delete/{id}:
    delete:
      tags: [Tool]
      summary: Delete a tool
      description: Deletes a tool from the external API.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Tool deleted
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/tool/attach/{assistant_id}:
    post:
      tags: [Tool]
      summary: Attach tools to an assistant
