openapi: 3.0.3
info:
  title: INTVoicekit API
  description: |
    Backend API for INTVoicekit - a voice assistant platform built on Express.js with MongoDB.
    This API acts as a proxy layer between clients and the external Vyom LiveKit API,
    managing local state for users, assistants, SIP trunks, tools, inbound configurations,
    and analytics.

    ## Authentication
    Most endpoints require a valid `user_id` (MongoDB ObjectId) that maps to a user with a
    stored `api_key`. That `api_key` is forwarded as a Bearer token to the external Vyom API.

    There is no JWT/session-based authentication at the Express layer -- authentication is
    implicit per-request via user lookup.

    ## Dual ID Resolution
    Many endpoints accept either a local MongoDB `_id` or an external service ID
    (e.g., `external_assistant_id`, `external_trunk_id`).

    ## External API Proxy
    Most service methods proxy requests to `https://api-livekit-vyom.indusnettechnologies.com/*`,
    forwarding the user's Bearer token. External responses are typically passed through directly.
  version: 1.0.0
  contact:
    name: INTVoicekit Support

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
    description: User authentication and registration
  - name: Assistant
    description: Voice assistant management (CRUD, call logs, billable minutes)
  - name: SIP
    description: SIP trunk management (outbound trunks)
  - name: Call
    description: Outbound call initiation
  - name: Integration
    description: Third-party service integration API key management
  - name: Tool
    description: Tool management and assistant attachment
  - name: Web Call
    description: Web-based call token generation
  - name: Passthrough Call
    description: Passthrough mode outbound calls and records
  - name: Inbound
    description: Inbound call configuration and assignment
  - name: Inbound Context Strategy
    description: Inbound context strategy management (webhooks)
  - name: Analytics
    description: Call analytics and dashboard metrics
  - name: Audio
    description: Audio file upload, listing, and management

paths:
  # ==================== AUTH ====================
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new user account with organization details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, org_name, user_email, password]
              properties:
                user_name:
                  type: string
                  example: "john_doe"
                org_name:
                  type: string
                  example: "Acme Corp"
                user_email:
                  type: string
                  format: email
                  example: "john@acme.com"
                password:
                  type: string
                  format: password
                  example: "securePass123"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User registered successfully"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "665f1a2b3c4d5e6f7a8b9c0d"
                      user_name:
                        type: string
                        example: "john_doe"
                      user_email:
                        type: string
                        example: "john@acme.com"
                      api_key:
                        type: string
                        nullable: true
                        example: null
        '400':
          description: Validation error or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with credentials
      description: Authenticates a user by username and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, password]
              properties:
                user_name:
                  type: string
                  example: "john_doe"
                password:
                  type: string
                  format: password
                  example: "securePass123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login successful"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "665f1a2b3c4d5e6f7a8b9c0d"
                      user_name:
                        type: string
                        example: "john_doe"
                      user_email:
                        type: string
                        example: "john@acme.com"
                      api_key:
                        type: string
                        example: "vyom_livekit_xxxxxxxxxxxxxxxx"
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/get_api:
    get:
      tags: [Auth]
      summary: Get user API key
      description: Retrieves the API key for a given user by username.
      parameters:
        - name: user_name
          in: query
          required: true
          schema:
            type: string
          example: "john_doe"
      responses:
        '200':
          description: API key retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    example: "665f1a2b3c4d5e6f7a8b9c0d"
                  user_name:
                    type: string
                    example: "john_doe"
                  api_key:
                    type: string
                    example: "vyom_livekit_xxxxxxxxxxxxxxxx"
        '400':
          description: Missing user_name parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found or no API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== ASSISTANT ====================
  /api/assistant/create:
    post:
      tags: [Assistant]
      summary: Create a new voice assistant
      description: |
        Creates a voice assistant both locally in MongoDB and externally via the Vyom API.
        Supports two LLM modes: `pipeline` (uses TTS models like sarvam, cartesia, elevenlabs)
        and `realtime` (uses real-time LLM providers like Gemini).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, assistant_name, assistant_description, assistant_prompt]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                assistant_name:
                  type: string
                  example: "Customer Support Bot"
                assistant_description:
                  type: string
                  example: "Handles inbound customer support queries"
                assistant_prompt:
                  type: string
                  example: "You are a helpful customer support agent..."
                assistant_llm_mode:
                  type: string
                  enum: [pipeline, realtime]
                  default: pipeline
                  example: "pipeline"
                assistant_llm_config:
                  allOf:
                    - $ref: '#/components/schemas/AssistantLlmConfig'
                    - description: Required when mode=realtime, optional in pipeline.
                assistant_tts_model:
                  type: string
                  description: Required in pipeline mode. Must be sent together with assistant_tts_config.
                  enum: [sarvam, cartesia, elevenlabs, mistral]
                  example: "sarvam"
                assistant_tts_config:
                  $ref: '#/components/schemas/AssistantTtsConfig'
                assistant_stt_model:
                  type: string
                  description: >
                    User-transcription source (pipeline mode only). `sarvam` resolves its key
                    from the `sarvam` integration — the same row the TTS slot uses, since Sarvam
                    issues one key for both. `native` needs no integration key.
                  enum: [sarvam, native]
                  default: sarvam
                assistant_stt_config:
                  $ref: '#/components/schemas/AssistantSttConfig'
                assistant_start_instruction:
                  type: string
                  example: "Greet the user warmly"
                assistant_interaction_config:
                  $ref: '#/components/schemas/AssistantInteractionConfig'
                assistant_end_call_enabled:
                  type: boolean
                  example: false
                assistant_end_call_trigger_phrase:
                  type: string
                  example: "goodbye"
                assistant_end_call_agent_message:
                  type: string
                  example: "Thank you for calling. Goodbye!"
                assistant_end_call_url:
                  type: string
                  format: uri
                  example: "https://example.com/webhook/end-call"
                assistant_greeting_audio:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                    audio_id:
                      type: string
                      example: "audio_123"
      responses:
        '201':
          description: Assistant created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Assistant created successfully"
                  assistant:
                    $ref: '#/components/schemas/Assistant'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/list:
    get:
      tags: [Assistant]
      summary: List all assistants
      description: Retrieves a paginated list of assistants from the external API.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        '200':
          description: Assistant list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assistant'
        '400':
          description: Missing user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/details/{id}:
    get:
      tags: [Assistant]
      summary: Get assistant details
      description: Retrieves details for a specific assistant by local or external ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assistant details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assistant'
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assistant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/update/{id}:
    patch:
      tags: [Assistant]
      summary: Update an assistant
      description: Updates an assistant locally and on the external Vyom API.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                assistant_name:
                  type: string
                assistant_description:
                  type: string
                assistant_prompt:
                  type: string
                assistant_llm_mode:
                  type: string
                  enum: [pipeline, realtime]
                  description: >
                    Target mode. Only this field (or the presence of TTS/STT fields) switches
                    mode — sending assistant_llm_config alone does NOT, and leaves the stored
                    TTS/STT config untouched.
                assistant_llm_config:
                  allOf:
                    - $ref: '#/components/schemas/AssistantLlmConfig'
                    - description: >
                        Required only when switching into realtime. Safe to send on its own in
                        pipeline mode to rotate api_key or pick gemini.
                assistant_tts_model:
                  type: string
                  enum: [sarvam, cartesia, elevenlabs, mistral]
                  description: >
                    Only required when no TTS config is stored yet. Either half of the TTS pair
                    is enough — the other is filled in from the stored assistant, so changing
                    just the config keeps the model and vice versa. Switching provider without
                    a new config resets to that provider's defaults.
                assistant_tts_config:
                  $ref: '#/components/schemas/AssistantTtsConfig'
                assistant_stt_model:
                  type: string
                  enum: [sarvam, native]
                  description: >
                    `sarvam` resolves its key from the `sarvam` integration — the same row the
                    TTS slot uses. Returns 400 if that row does not exist. Sending the model
                    alone resets that provider's config to its defaults.
                assistant_stt_config:
                  $ref: '#/components/schemas/AssistantSttConfig'
                assistant_start_instruction:
                  type: string
                assistant_interaction_config:
                  $ref: '#/components/schemas/AssistantInteractionConfig'
                assistant_end_call_enabled:
                  type: boolean
                assistant_end_call_trigger_phrase:
                  type: string
                assistant_end_call_agent_message:
                  type: string
                assistant_end_call_url:
                  type: string
                assistant_greeting_audio:
                  type: object
      responses:
        '200':
          description: Assistant updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Assistant updated successfully"
                  data:
                    type: object
                    properties:
                      assistant_id:
                        type: string
                  local_data:
                    $ref: '#/components/schemas/Assistant'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/delete/{id}:
    delete:
      tags: [Assistant]
      summary: Delete an assistant
      description: Deletes an assistant from both local DB and external API.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: Can also be provided in request body
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Alternative to query parameter
      responses:
        '200':
          description: Assistant deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Assistant deleted successfully"
                  data:
                    type: object
                    properties:
                      assistant_id:
                        type: string
                  local_data_removed:
                    type: boolean
                    example: true
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/call-logs/{id}:
    get:
      tags: [Assistant]
      summary: Get assistant call logs
      description: Retrieves paginated call logs for a specific assistant.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Call logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/billable-minutes/{id}:
    get:
      tags: [Assistant]
      summary: Get billable minutes for an assistant
      description: Calculates total billable minutes for a specific assistant and phone number.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: to_number
          in: query
          required: true
          schema:
            type: string
          example: "+1234567890"
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Billable minutes calculated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Total billable minutes calculated successfully"
                  data:
                    type: object
                    properties:
                      assistant_id:
                        type: string
                      to_number:
                        type: string
                      total_billable_minutes:
                        type: number
                        example: 125.5
                        description: >
                          Renamed from total_billable_duration_minutes so this endpoint and
                          platform-billable-minutes use one key for the same quantity.
                      timespan_evaluated:
                        type: object
                        properties:
                          start_date:
                            type: string
                          end_date:
                            type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/platform-billable-minutes:
    get:
      tags: [Assistant]
      summary: Get platform-wise billable minutes
      description: Calculates billable minutes grouped by platform phone number.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Platform billable minutes retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Platform-wise billable minutes calculated successfully"
                  data:
                    type: object
                    properties:
                      platform_wise_minutes:
                        type: array
                        items:
                          type: object
                          properties:
                            platform_number:
                              type: string
                            total_billable_minutes:
                              type: number
                      timespan_evaluated:
                        type: object
                        properties:
                          start_date:
                            type: string
                          end_date:
                            type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/platform-billable-minutes/download:
    get:
      tags: [Assistant]
      summary: Download platform billable minutes as Excel
      description: Downloads an Excel file (.xlsx) with platform-wise billable minutes.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== SIP ====================
  /api/sip/create-outbound-trunk:
    post:
      tags: [SIP]
      summary: Create an outbound SIP trunk
      description: |
        Creates a SIP trunk both locally and externally. Supports Twilio and Exotel trunk types.
        Optionally enables passthrough mode for direct WebSocket connections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, trunk_name, trunk_type, trunk_config]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                trunk_name:
                  type: string
                  example: "Production Twilio Trunk"
                trunk_type:
                  type: string
                  enum: [twilio, exotel]
                  example: "twilio"
                trunk_config:
                  type: object
                  description: |
                    For Twilio: { "address": "string", "numbers": ["string"], "username": "string", "password": "string" }
                    For Exotel: { "exotel_number": "string" }
                  properties:
                    address:
                      type: string
                      example: "pstn.twilio.com"
                    numbers:
                      type: array
                      items:
                        type: string
                      example: ["+1234567890"]
                    username:
                      type: string
                    password:
                      type: string
                    exotel_number:
                      type: string
                passthrough_mode:
                  type: boolean
                  default: false
                passthrough_webhook_url:
                  type: string
                  format: uri
      responses:
        '201':
          description: Outbound trunk created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Outbound trunk created successfully locally and externally"
                  trunk:
                    $ref: '#/components/schemas/SipTrunk'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sip/list:
    get:
      tags: [SIP]
      summary: List SIP trunks
      description: Retrieves all SIP trunks for a user from the local database.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SIP trunks retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "SIP trunks retrieved successfully from local database"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SipTrunk'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sip/details/{id}:
    get:
      tags: [SIP]
      summary: Get SIP trunk details
      description: Retrieves details for a specific SIP trunk by local or external ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SIP trunk details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SipTrunk'
        '404':
          description: SIP trunk not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sip/delete/{id}:
    delete:
      tags: [SIP]
      summary: Delete a SIP trunk
      description: Deletes a SIP trunk from the local database.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: Can also be provided in request body
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Alternative to query parameter
      responses:
        '200':
          description: SIP trunk deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "SIP trunk deleted successfully from local database"
                  data:
                    type: object
                    properties:
                      local_id:
                        type: string
                      trunk_id:
                        type: string
                  local_data_removed:
                    type: boolean
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== CALL ====================
  /api/call/outbound:
    post:
      tags: [Call]
      summary: Initiate an outbound call
      description: Initiates an outbound call using an assistant and SIP trunk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, assistant_id, trunk_id, to_number]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                assistant_id:
                  type: string
                  description: Local _id or external_assistant_id
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                trunk_id:
                  type: string
                  description: Local _id or external_trunk_id
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                to_number:
                  type: string
                  example: "+1234567890"
                metadata:
                  type: object
                  description: Optional metadata passed through to the external call API
                  example: {"campaign_id": "promo_2024", "source": "web"}
      responses:
        '200':
          description: Call initiated (external API response)
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== INTEGRATION ====================
  /api/integration/store:
    post:
      tags: [Integration]
      summary: Store integration API key
      description: |
        Saves an API key for a third-party service (TTS or LLM).
        Service type is auto-inferred from the service name if not provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, service_name, api_key]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                service_type:
                  type: string
                  enum: [TTS, LLM, STT]
                  description: >
                    Optional. Derived from `service_name` when omitted, which is the
                    recommended usage — the server's provider map is the source of truth.
                service_name:
                  type: string
                  enum: [sarvam, cartesia, elevenlabs, mistral, openai, gemini]
                  example: "sarvam"
                  description: >
                    Which provider this key belongs to. One row per provider: Sarvam issues a
                    single key serving both TTS and STT, so the `sarvam` row covers both slots.
                    An unrecognised name is rejected with `400`.
                api_key:
                  type: string
                  example: "sk-xxxxxxxxxxxx"
      responses:
        '200':
          description: API key saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Integration API key saved successfully"
                  data:
                    type: object
                    properties:
                      service_type:
                        type: string
                        example: "TTS"
                      service_name:
                        type: string
                        example: "sarvam"
                      api_key_preview:
                        type: string
                        example: "***xxxx"
                  resync:
                    type: object
                    nullable: true
                    description: Re-sync job status if existing assistants were updated
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
                        enum: [running, completed, error, interrupted]
                        description: >
                          `running` while assistants are being re-pushed, `completed` on
                          success, `error` on failure, `interrupted` when the process died
                          mid-job (synthesized on read, never stored).
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/integration/get:
    get:
      tags: [Integration]
      summary: Get integration API key
      description: Retrieves the stored API key for a specific service.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: service_name
          in: query
          required: true
          schema:
            type: string
            enum: [sarvam, cartesia, elevenlabs, mistral, openai, gemini]
      responses:
        '200':
          description: API key retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      service_type:
                        type: string
                      service_name:
                        type: string
                      api_key:
                        type: string
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/integration/resync-status:
    get:
      tags: [Integration]
      summary: Get re-sync job status
      description: Retrieves the status of a re-sync job for a user and service.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: service_name
          in: query
          required: true
          schema:
            type: string
            enum: [sarvam, cartesia, elevenlabs, mistral, openai, gemini]
      responses:
        '200':
          description: Re-sync status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
                        enum: [running, completed, error, interrupted]
                        description: >
                          `running` while assistants are being re-pushed, `completed` on
                          success, `error` on failure, `interrupted` when the process died
                          mid-job (synthesized on read, never stored).
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No re-sync job found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/integration/resync:
    post:
      tags: [Integration]
      summary: Trigger re-sync for a service
      description: |
        Manually triggers a re-sync to push updated API keys to all existing
        assistants using this provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, service_name]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                service_name:
                  type: string
                  enum: [sarvam, cartesia, elevenlabs, mistral, openai, gemini]
                  example: "sarvam"
      responses:
        '202':
          description: Re-sync triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  resync:
                    type: object
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

