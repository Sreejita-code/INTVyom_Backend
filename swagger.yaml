components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Something went wrong"

    Assistant:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        user_id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        external_assistant_id:
          type: string
          example: "ext_asst_abc123"
        name:
          type: string
          example: "Customer Support Bot"
        description:
          type: string
          example: "Handles inbound customer support queries"
        prompt:
          type: string
          example: "You are a helpful customer support agent..."
        llm_mode:
          type: string
          enum: [pipeline, realtime]
          example: "pipeline"
        llm_provider:
          type: string
          enum: [openai, gemini]
          default: openai
          example: "openai"
        llm_config:
          type: object
          nullable: true
        tts_model:
          type: string
          nullable: true
          description: TTS provider. Stored as `model` before the tts_* rename.
        tts_config:
          type: object
          nullable: true
          description: TTS provider config. Stored as `config` before the tts_* rename.
        stt_model:
          type: string
          nullable: true
        stt_config:
          type: object
          nullable: true
        start_instruction:
          type: string
          nullable: true
        interaction_config:
          $ref: '#/components/schemas/AssistantInteractionConfig'
        greeting_audio:
          type: object
          nullable: true
        end_call_enabled:
          type: boolean
          example: false
        end_call_trigger_phrase:
          type: string
          nullable: true
        end_call_agent_message:
          type: string
          nullable: true
        end_call_url:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Shared by assistant create, assistant update and the Assistant response so the three
    # cannot drift. Mirrors assistant_interaction_config on the external API exactly.
    AssistantInteractionConfig:
      type: object
      description: >
        Interaction settings. Partial updates are merged with the stored config — omitted
        fields keep their current value.
      properties:
        speaks_first:
          type: boolean
          default: true
          description: Assistant sends the opening response first. Works in both modes.
        filler_words:
          type: boolean
          default: false
          description: >
            Filler words while the user speaks. Pipeline mode only — forced to false in
            realtime, which has no external TTS.
        silence_reprompts:
          type: boolean
          default: false
        silence_reprompt_interval:
          type: number
          default: 10.0
          description: Seconds of silence before reprompting (1.0-60.0).
        silence_max_reprompts:
          type: integer
          default: 2
          description: Maximum reprompts before the session ends (0-5).
        background_sound_enabled:
          type: boolean
          default: true
        thinking_sound_enabled:
          type: boolean
          default: true
        allow_interruptions:
          type: boolean
          default: false
          description: Whether the user may interrupt the assistant's initial greeting.
        input_guard_window_sec:
          type: number
          default: 3.0
          description: >
            Seconds at the start of every agent reply during which caller audio is blanked
            (0.0-10.0). Blocks repeated "Hello?" and fillers from cutting the agent off.
            Releases early if the reply finishes. `0` disables the guard.
        max_call_duration_minutes:
          type: number
          nullable: true
          description: >
            Hard ceiling on active-call length in minutes (> 0). On reaching it the assistant
            speaks a brief farewell and the call ends gracefully with call_end_reason
            `max_duration_exceeded`. Unset/null = platform default of 30 minutes.
        preferred_languages:
          type: array
          items:
            type: string
          default: []
          example: ["hi-IN", "en-US"]
          description: >
            BCP-47 codes hinting the STT model for multilingual or code-switched speakers.
            This is the only language input that is a LIST — the per-provider TTS/STT language
            fields (`assistant_tts_config.target_language_code`,
            `assistant_stt_config.language`) are each a single string. Empty list = auto-detect.

    AssistantLlmConfig:
      type: object
      description: >
        LLM vendor config. Optional in pipeline mode (defaults to `openai`; only `api_key`
        affects runtime behavior there) and required when switching into realtime. When
        `api_key` is omitted, the key is resolved from the Integrations module; in pipeline
        mode a missing integration is not an error — the external API's system key is used.
      properties:
        provider:
          type: string
          enum: [openai, gemini]
          example: "gemini"
        model:
          type: string
          description: >
            Realtime only. Gemini default `gemini-3.1-flash-live-preview`,
            OpenAI default `gpt-realtime-1.5`.
        voice:
          type: string
          description: Realtime only (ignored in pipeline — external TTS handles audio). Gemini default `Puck`, OpenAI default `marin`.
        api_key:
          type: string
          example: "sk-..."

    AssistantTtsConfig:
      type: object
      description: >
        TTS config for the selected `assistant_tts_model`. Any `api_key` sent here is ignored —
        the key always comes from the Integrations module. Send the fields for your provider:
        sarvam -> `speaker` (required) + `target_language_code`; cartesia / elevenlabs /
        mistral -> `voice_id` (required).
      properties:
        speaker:
          type: string
          description: Sarvam only, required.
          example: "anushka"
        target_language_code:
          type: string
          description: >
            Sarvam only. A SINGLE BCP-47 string, not a list. Default `bn-IN`. For a
            multilingual agent set `assistant_interaction_config.preferred_languages` instead.
          example: "hi-IN"
        voice_id:
          type: string
          description: Cartesia / ElevenLabs / Mistral, required.
          example: "a167e0f3-df7e-4277-976b-be2f952fa275"

    AssistantSttConfig:
      type: object
      description: >
        STT config for the selected `assistant_stt_model` (requires it — a config on its own is
        rejected). Any `api_key` sent here is ignored; the key comes from the Integrations
        module. `native` takes no fields.
      properties:
        model:
          type: string
          default: "saaras:v3"
          description: Sarvam STT model.
        language:
          type: string
          default: "unknown"
          description: >
            Sarvam only. A SINGLE BCP-47 string, or `unknown` to auto-detect. Not a list.
          example: "hi-IN"

    SipTrunk:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        user_id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        external_trunk_id:
          type: string
          example: "ext_trunk_xyz789"
        trunk_name:
          type: string
          example: "Production Twilio Trunk"
        trunk_type:
          type: string
          enum: [twilio, exotel]
          example: "twilio"
        trunk_config:
          type: object
          description: Type-specific configuration (Twilio or Exotel)
        passthrough_mode:
          type: boolean
          example: false
        passthrough_webhook_url:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  securitySchemes:
    UserIdAuth:
      type: apiKey
      in: query
      name: user_id
      description: |
        Most endpoints require a valid user_id query parameter or request body field.
        The server looks up the user's stored api_key and forwards it as a Bearer token
        to the external Vyom API.

globalSecurity:
  - UserIdAuth: []
