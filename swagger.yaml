  # ==================== AUDIO ====================
  /api/audio/upload:
    post:
      tags: [Audio]
      summary: Upload an audio file
      description: |
        Uploads an audio file for use with voice assistants.
        Uses multipart/form-data with a file field.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [user_id, audio_name, transcript, file]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                audio_name:
                  type: string
                  example: "Welcome Greeting"
                transcript:
                  type: string
                  example: "Hello, welcome to our service!"
                file:
                  type: string
                  format: binary
                  description: Audio file (binary)
      responses:
        '200':
          description: Audio uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      audio_id:
                        type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/audio/list:
    get:
      tags: [Audio]
      summary: List audio files
      description: Retrieves a paginated list of uploaded audio files.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Audio list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/audio/{audio_id}:
    get:
      tags: [Audio]
      summary: Get audio details
      description: Retrieves details for a specific audio file.
      parameters:
        - name: audio_id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audio details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Audio]
      summary: Delete an audio file
      description: Deletes a specific audio file.
      parameters:
        - name: audio_id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audio deleted
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Something went wrong"

    Assistant:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        user_id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        external_assistant_id:
          type: string
          example: "ext_asst_abc123"
        name:
          type: string
          example: "Customer Support Bot"
        description:
          type: string
          example: "Handles inbound customer support queries"
        prompt:
          type: string
          example: "You are a helpful customer support agent..."
        llm_mode:
          type: string
          enum: [pipeline, realtime, cascade]
          example: "pipeline"
          description: >
            Runtime mode. Mirrors `assistant_mode` on the external API. `cascade` is the true
            STT → LLM → TTS pipeline (openai LLM only, plugin STT + TTS).
        llm_provider:
          type: string
          enum: [openai, gemini]
          default: openai
          example: "openai"
        llm_config:
          type: object
          nullable: true
        tts_model:
          type: string
          nullable: true
          description: TTS provider. Stored as `model` before the tts_* rename.
        tts_config:
          type: object
          nullable: true
          description: TTS provider config. Stored as `config` before the tts_* rename.
        stt_model:
          type: string
          nullable: true
        stt_config:
          type: object
          nullable: true
        start_instruction:
          type: string
          nullable: true
        interaction_config:
          $ref: '#/components/schemas/AssistantInteractionConfig'
        greeting_audio:
          type: object
          nullable: true
        end_call_enabled:
          type: boolean
          example: false
        end_call_trigger_phrase:
          type: string
          nullable: true
        end_call_agent_message:
          type: string
          nullable: true
        end_call_url:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Shared by assistant create, assistant update and the Assistant response so the three
    # cannot drift. Mirrors assistant_interaction_config on the external API exactly.
    AssistantInteractionConfig:
      type: object
      description: >
        Interaction settings. Partial updates are merged with the stored config — omitted
        fields keep their current value.
      properties:
        speaks_first:
          type: boolean
          default: true
          description: Assistant sends the opening response first. Works in both modes.
        filler_words:
          type: boolean
          default: false
          description: >
            Filler words while the user speaks. Pipeline mode only — forced to false in
            realtime, which has no external TTS.
        silence_reprompts:
          type: boolean
          default: false
        silence_reprompt_interval:
          type: number
          default: 10.0
          description: Seconds of silence before reprompting (1.0-60.0).
        silence_max_reprompts:
          type: integer
          default: 2
          description: Maximum reprompts before the session ends (0-5).
        background_sound_enabled:
          type: boolean
          default: true
        thinking_sound_enabled:
          type: boolean
          default: true
        allow_interruptions:
          type: boolean
          default: false
          description: Whether the user may interrupt the assistant's initial greeting.
        input_guard_window_sec:
          type: number
          default: 3.0
          description: >
            Seconds at the start of every agent reply during which caller audio is blanked
            (0.0-10.0). Blocks repeated "Hello?" and fillers from cutting the agent off.
            Releases early if the reply finishes. `0` disables the guard.
        max_call_duration_minutes:
          type: number
          nullable: true
          description: >
            Hard ceiling on active-call length in minutes (> 0). On reaching it the assistant
            speaks a brief farewell and the call ends gracefully with call_end_reason
            `max_duration_exceeded`. Unset/null = platform default of 30 minutes.
        preferred_languages:
          type: array
          items:
            type: string
          default: []
          example: ["hi-IN", "en-US"]
          description: >
            BCP-47 codes hinting the STT model for multilingual or code-switched speakers.
            This is the only language input that is a LIST — the per-provider TTS/STT language
            fields (`assistant_tts_config.target_language_code`,
            `assistant_stt_config.language`) are each a single string. Empty list = auto-detect.

    AssistantLlmConfig:
      type: object
      description: >
        LLM vendor config. Optional in pipeline mode (defaults to `openai`; only `api_key` and
        `model` affect runtime behavior there) and required when switching into realtime. Any
        `api_key` sent here is replaced with the key stored in the Integrations module; in
        pipeline mode a missing integration is not an error — the external API's system key is
        used. In `cascade` mode `provider` must be `openai`, `model` is checked against the
        cascade allowlist, and `voice` is ignored.

        The seven generation knobs (`temperature` through `parallel_tool_calls`) are accepted
        and stored in every mode but only READ in `cascade` — they are `openai.responses.LLM`
        parameters, and pipeline/realtime talk to the Realtime API instead.
      properties:
        provider:
          type: string
          enum: [openai, gemini]
          description: >
            `openai` or `gemini` in realtime; `openai` ONLY in pipeline and cascade. `gemini`
            in pipeline mode is rejected with 400 — Google's Live API cannot run the text-only
            modality a half-cascade needs. Use `assistant_mode: realtime` for Gemini.
          example: "gemini"
        model:
          type: string
          description: >
            Validated per mode against a different list, because each mode talks to a different
            API. Pipeline and realtime+openai: `gpt-realtime`, `gpt-realtime-1.5`,
            `gpt-realtime-mini`, `gpt-4o-realtime-preview`, `gpt-4o-mini-realtime-preview`
            (default `gpt-realtime-1.5`). Realtime+gemini: any Live model string, unvalidated
            (default `gemini-3.1-flash-live-preview`). Cascade (default `gpt-4.1`): `gpt-4.1`,
            `gpt-4.1-mini`, `gpt-4.1-nano`, `gpt-4o`, `gpt-4o-mini`, `gpt-5`, `gpt-5-mini`,
            `gpt-5-nano`, `gpt-5.1`, `gpt-5.1-chat-latest`, `gpt-5.2`, `gpt-5.2-chat-latest`,
            `gpt-5.3-chat-latest`, `gpt-5.4`, `gpt-5.4-mini`, `gpt-5.4-nano`, `gpt-5.5`,
            `gpt-5.6-sol`, `gpt-5.6-terra`, `gpt-5.6-luna`, `chat-latest`, `gpt-oss-120b`.
            The two sets are disjoint — sending one family's ID in the other's mode is a 400.
        voice:
          type: string
          description: >
            Realtime only (ignored in pipeline and cascade — the TTS provider owns the voice).
            Gemini default `Puck`, OpenAI default `marin`.
        api_key:
          type: string
          description: Ignored — the key always comes from the Integrations module.
          example: "sk-..."
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: >
            Cascade only. Sampling temperature, 0-2 (SDK default 0.8). Higher = more random.
            IGNORED by reasoning models (`gpt-5`, `gpt-5.x`) — send `reasoning_effort` there.
          example: 0.7
        max_output_tokens:
          type: integer
          minimum: 1
          description: Cascade only. Cap on output tokens per response. Unset = model default.
          example: 500
        reasoning_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          description: >
            Cascade only, and only on REASONING models (`gpt-5`, `gpt-5.x`). How much the model
            thinks before answering. Higher = slower and dearer; on a voice call that is
            audible latency, so prefer `low`/`minimal` unless the task needs the depth.
          example: "low"
        service_tier:
          type: string
          enum: [auto, default, flex, scale, priority]
          description: Cascade only. OpenAI processing/billing tier. Unset = OpenAI's default.
        verbosity:
          type: string
          enum: [low, medium, high]
          description: >
            Cascade only. Constrains response length. `low` suits voice calls, where a long
            reply is a long wait.
        tool_choice:
          type: string
          enum: [auto, required, none]
          description: >
            Cascade only. Whether the model may call the assistant's attached tools.
            `none` disables them for this assistant without detaching them.
        parallel_tool_calls:
          type: boolean
          description: Cascade only. Allow more than one tool call in a single response.

    AssistantTtsConfig:
      type: object
      description: >
        TTS config for the selected `assistant_tts_model`. Any `api_key` sent here is ignored —
        the key always comes from the Integrations module. Send the fields for your provider:
        sarvam -> `speaker` (required); cartesia / elevenlabs / mistral -> `voice_id`
        (required). Every block is STRICT — an unrecognised key is rejected with 422 rather
        than silently dropped, so a typo like `speaking_rate` fails at create time.

        Speaking speed is per-provider and NOT interchangeable: cartesia `speed`, sarvam
        `pace`, elevenlabs `voice_settings.speed`. Mistral exposes no rate knob.
      properties:
        speaker:
          type: string
          description: Sarvam only, required.
          example: "anushka"
        target_language_code:
          type: string
          description: >
            Sarvam only. A SINGLE BCP-47 string, not a list. Omit and the platform substitutes
            `en-IN`. NOTE: assistants created before this default was corrected have `bn-IN`
            written into their stored config — send the field explicitly to fix them. For a
            multilingual agent set `assistant_interaction_config.preferred_languages` instead.
          example: "hi-IN"
        pace:
          type: number
          minimum: 0.3
          maximum: 3.0
          default: 1.0
          description: Sarvam only. Speaking pace multiplier; >1.0 faster, <1.0 slower.
          example: 1.1
        speech_sample_rate:
          type: number
          enum: [8000, 16000, 22050, 24000, 32000, 44100, 48000]
          default: 24000
          description: >
            Sarvam only. Output sample rate in Hz — any other value is rejected. Use `8000`
            only for narrowband telephony.
        temperature:
          type: number
          minimum: 0.01
          maximum: 2.0
          default: 0.3
          description: Sarvam only. TTS sampling temperature. Lower = more stable delivery.
        voice_id:
          type: string
          description: Cartesia / ElevenLabs / Mistral, required.
          example: "a167e0f3-df7e-4277-976b-be2f952fa275"
        language:
          type: string
          default: "en"
          description: >
            Cartesia only. BCP-47 code for the input text; affects pronunciation only.
          example: "en"
        speed:
          type: number
          minimum: 0
          maximum: 3
          default: 1.0
          description: >
            Cartesia only. Numeric multiplier of normal speed (1.5 = 50% faster). The preset
            strings `slow`/`normal`/`fast` are NOT accepted — `sonic-3` requires a float.
          example: 1.1
        volume:
          type: number
          minimum: 0
          maximum: 3
          default: 1.0
          description: Cartesia only. Output volume, where 1.0 is the default level.
        emotion:
          type: string
          description: >
            Cartesia only, Sonic 3 only. Emotion control string, e.g. `excited`, `calm`, `sad`.
          example: "calm"
        pronunciation_dict_id:
          type: string
          description: >
            Cartesia only, Sonic 3 models only. ID of a Cartesia pronunciation dictionary to
            apply — the way to fix how the agent says names, SKUs and domain jargon.
        model:
          type: string
          enum: [eleven_v3, eleven_multilingual_v2, eleven_turbo_v2_5, eleven_flash_v2_5]
          default: eleven_v3
          description: >
            ElevenLabs only — the one provider whose synthesis model is selectable. The other
            three are fixed (cartesia `sonic-3`, sarvam `bulbul:v3`, mistral
            `voxtral-mini-tts-2603`) and reject a `model` key.
        voice_settings:
          type: object
          description: >
            ElevenLabs only. Voice tuning. Strict, like its parent — an unknown key here is a
            422 too.
          properties:
            stability:
              type: number
              minimum: 0
              maximum: 1
            similarity_boost:
              type: number
              minimum: 0
              maximum: 1
            style:
              type: number
              minimum: 0
              maximum: 1
            speed:
              type: number
              minimum: 0.25
              maximum: 4.0
              description: ElevenLabs speaking rate. Not the same key as cartesia `speed`.
            use_speaker_boost:
              type: boolean

    AssistantSttConfig:
      type: object
      description: >
        STT config for the selected `assistant_stt_model` (requires it — a config on its own is
        rejected). Omit it entirely and the provider's defaults are used. Any `api_key` sent
        here is overwritten; the key comes from the Integrations module, and for `deepgram`
        that means a `deepgram` integration must exist first. `native` takes no fields.
        The block is STRICT — an unknown key (a typo like `enable_diarisation`) is a 422.

        Five providers are valid in `cascade`: `sarvam`, `cartesia`, `deepgram`, `elevenlabs`,
        `openai`. In `pipeline` mode `sarvam` and `native` run for real; the other four are
        accepted and stored, but that call transcribes natively — the selection takes effect
        when the assistant moves to `cascade`. Ignored entirely in `realtime`.

        LANGUAGE DEFAULTS ARE NOT UNIFORM. Omitting the language field auto-detects on
        `sarvam` and `elevenlabs`, but falls back to `preferred_languages[0]` then plain `en`
        on `deepgram` and `openai`, and `cartesia` cannot auto-detect at all. For a caller who
        may switch languages, set `deepgram` `language: multi` or `openai`
        `detect_language: true` explicitly — do not rely on the omission.
      properties:
        model:
          type: string
          description: >
            Per provider. Sarvam: `saaras:v3` (default), `saaras:v2.5`, `saarika:v2.5`.
            Cartesia: `ink-whisper` (default, 43 languages) or `ink-2` (English only).
            Deepgram: `nova-3` (default, multilingual/45 languages), `nova-2`,
            `flux-general-en` (English only), `flux-general-multi`.
            ElevenLabs: `scribe_v2_realtime` (default, auto-detects ~190 languages),
            `scribe_v2`, `scribe_v1`.
            OpenAI: `gpt-4o-mini-transcribe` (default, fast and cheap), `gpt-4o-transcribe`
            (more accurate), `whisper-1` (legacy batch model — the only one that reads
            `prompt`). `gpt-realtime-whisper` is REJECTED: it has no server-side endpointing.
        language:
          type: string
          description: >
            Sarvam / Cartesia / Deepgram / OpenAI. A SINGLE BCP-47 string, not a list — the
            list field is `assistant_interaction_config.preferred_languages`.
            Sarvam: `unknown` (default) auto-detects. Cartesia: a fixed code, no auto-detect.
            Deepgram: a fixed code, or `multi` to auto-detect per segment (billed at a higher
            per-minute rate than monolingual). OpenAI: an ISO-639-1 code; omitting does NOT
            auto-detect, and it is ignored when `detect_language` is true.
          example: "hi-IN"
        mode:
          type: string
          enum: [codemix, transcribe, translate, verbatim, translit]
          default: codemix
          description: >
            Sarvam only, `saaras:v3` only. `codemix` (default) keeps code-switching intact
            within an utterance; `transcribe` plain; `translate` returns English; `verbatim`
            keeps fillers/repetitions; `translit` romanises Indic script. Honored in both
            `pipeline` and `cascade`.
        enable_diarization:
          type: boolean
          default: false
          description: >
            Deepgram only, and only on the `nova` models — pairing it with a `flux` model logs
            a warning and drops it. Labels each utterance with a speaker id. Omitted stays
            off; it is never force-enabled.
        keyterm:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: >
            Deepgram only, `nova-3` and `flux` only — `nova-2` uses a different keyword
            mechanism and silently ignores this. Biases recognition toward a term (product
            names, jargon). Omitted = not sent, no biasing.
          example: "invoice"
        language_code:
          type: string
          description: >
            ElevenLabs only (its spelling of `language`). SETTING IT DISABLES AUTO-DETECT and
            pins the language, so a caller who switches mid-call is mis-transcribed. Omit it —
            and leave `preferred_languages` empty — to auto-detect ~190 languages.
          example: "hi-IN"
        no_verbatim:
          type: boolean
          default: false
          description: >
            ElevenLabs only. Strips filler words (`um`, `uh`) and false starts from the
            transcript. Omitted keeps them.
        detect_language:
          type: boolean
          default: false
          description: >
            OpenAI only. Auto-detects the spoken language and OVERRIDES `language` (setting
            both is not an error — `language` is simply dropped). This is the only way to get
            auto-detect out of OpenAI STT; there is no "auto" language code.
        prompt:
          type: string
          description: >
            OpenAI only, `whisper-1` ONLY. Biases spellings and jargon (names, product terms).
            The `gpt-4o-transcribe` family accepts and ignores it — no error, no biasing.
          example: "Vyom, LiveKit, Exotel, SIP trunk, Sarvam"
        noise_reduction_type:
          type: string
          enum: [near_field, far_field]
          description: >
            OpenAI only. Server-side noise reduction: `near_field` for a headset, `far_field`
            for speakerphone or a room mic. Omitted applies none.
        use_realtime:
          type: boolean
          default: true
          description: >
            OpenAI only. `true` streams over OpenAI's realtime transcription WebSocket (interim
            results, low latency). `false` uses the batch REST API — cheaper, but it holds each
            utterance until it ends, adding a full turn of latency. This default INVERTS the
            plugin's own, because a live phone call needs the interim results.

    SipTrunk:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        user_id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        external_trunk_id:
          type: string
          example: "ext_trunk_xyz789"
        trunk_name:
          type: string
          example: "Production Twilio Trunk"
        trunk_type:
          type: string
          enum: [twilio, exotel]
          example: "twilio"
        trunk_config:
          type: object
          description: Type-specific configuration (Twilio or Exotel)
        passthrough_mode:
          type: boolean
          example: false
        passthrough_webhook_url:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  securitySchemes:
    UserIdAuth:
      type: apiKey
      in: query
      name: user_id
      description: |
        Most endpoints require a valid user_id query parameter or request body field.
        The server looks up the user's stored api_key and forwards it as a Bearer token
        to the external Vyom API.

globalSecurity:
  - UserIdAuth: []
