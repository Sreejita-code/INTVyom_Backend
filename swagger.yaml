          schema:
            type: string
          description: Can also be provided in request body
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Alternative to query parameter
      responses:
        '200':
          description: Assistant detached
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound/delete/{id}:
    delete:
      tags: [Inbound]
      summary: Delete inbound configuration
      description: |
        Deletes an inbound configuration from both local DB and external API. Upstream
        marks the mapping inactive, clears its attachments, and releases the normalized
        number for reuse.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: Can also be provided in request body
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Alternative to query parameter
      responses:
        '200':
          description: Inbound deleted
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== INBOUND CONTEXT STRATEGY ====================
  /api/inbound-context-strategy/create:
    post:
      tags: [Inbound Context Strategy]
      summary: Create an inbound context strategy
      description: |
        Creates a webhook-based context strategy for inbound calls. The strategy is
        attached to an inbound *number* (via /api/inbound), not to an assistant.

        The webhook is called once per inbound call, before the prompt renders, and its
        `context` object becomes available as `{{context.*}}` placeholders. A failing
        lookup never fails the call.

        The URL is validated upstream: `http`/`https` only, and the host must not be a
        private, loopback, link-local, reserved, or internal address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, name, strategy_config]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                name:
                  type: string
                  example: "Customer Context Strategy"
                type:
                  type: string
                  default: webhook
                  example: "webhook"
                strategy_config:
                  type: object
                  required: [url]
                  properties:
                    url:
                      type: string
                      format: uri
                      example: "https://example.com/webhook/context"
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                      description: >-
                        Headers sent to your webhook. Secret-looking values
                        (authorization, token, secret, api-key, password) come back
                        masked as **** from list/details.
                      example:
                        Authorization: "Bearer crm-token"
                    timeout_seconds:
                      type: number
                      default: 2.0
                      minimum: 0.5
                      maximum: 10.0
                      description: >-
                        Blocks the start of the call — keep it low. A 10s timeout means
                        up to 10s of silence for the caller.
                      example: 2.0
      responses:
        '201':
          description: Strategy created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: >-
            Missing fields, rejected URL, timeout_seconds out of range, or a masked ****
            header value sent as if it were real
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound-context-strategy/list:
    get:
      tags: [Inbound Context Strategy]
      summary: List inbound context strategies
      description: |
        Retrieves all active inbound context strategies. Secret header values are
        returned masked as `****` — never send a masked value back on update.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Strategy list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound-context-strategy/details/{id}:
    get:
      tags: [Inbound Context Strategy]
      summary: Get strategy details
      description: |
        Retrieves details for a specific inbound context strategy. Secret header values
        are returned masked as `****`; echoing a mask back on update is rejected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Local _id or external_strategy_id
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Strategy details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Strategy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound-context-strategy/update/{id}:
    patch:
      tags: [Inbound Context Strategy]
      summary: Update a strategy
      description: |
        Updates an inbound context strategy. Send at least one of `name` or
        `strategy_config`.

        `strategy_config` keys replace outright, **except** `headers`, which merges key
        by key: send only the headers you are changing, and send a header with value
        `null` to delete just that one. Everything you omit is left untouched.

        Never send back a `****` value from list/details — it is a mask, not the stored
        secret, and it is rejected with 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Local _id or external_strategy_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  default: webhook
                  description: >-
                    Optional. Defaults to the stored type; sent to upstream alongside
                    strategy_config, which upstream requires as a pair.
                strategy_config:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
                    headers:
                      type: object
                      nullable: true
                      additionalProperties:
                        type: string
                        nullable: true
                      description: Merged key by key. A null value deletes that header.
                      example:
                        Authorization: "Bearer rotated-token"
                        X-Tenant-Id: null
                    timeout_seconds:
                      type: number
                      minimum: 0.5
                      maximum: 10.0
      responses:
        '200':
          description: Strategy updated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: >-
            No fields provided, rejected URL, timeout_seconds out of range, or a masked
            **** header value echoed back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Strategy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound-context-strategy/delete/{id}:
    delete:
      tags: [Inbound Context Strategy]
      summary: Delete a strategy
      description: |
        Deletes an inbound context strategy from both local DB and external API.

        Cascades: every inbound mapping that referenced this strategy is detached from it
        (`inbound_context_strategy_id` set to null). The mappings themselves are not
        deleted and keep routing calls — just without caller-context lookup.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Local _id or external_strategy_id
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: Can also be provided in request body
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Alternative to query parameter
      responses:
        '200':
          description: Strategy deleted
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Strategy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== ANALYTICS ====================
  /api/analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Get analytics dashboard
      description: Retrieves an aggregated dashboard summary of call analytics.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Dashboard data retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    description: Aggregated dashboard metrics
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/analytics/calls/by-assistant:
    get:
      tags: [Analytics]
      summary: Get call analytics by assistant
      description: Retrieves call metrics grouped by assistant.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Per-assistant analytics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/analytics/calls/by-phone-number:
    get:
      tags: [Analytics]
      summary: Get call analytics by phone number
      description: Retrieves call metrics grouped by phone number.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - name: assistant_id
          in: query
          schema:
            type: string
          description: Filter by specific assistant
      responses:
        '200':
          description: Per-phone-number analytics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/analytics/calls/by-time:
    get:
      tags: [Analytics]
      summary: Get call analytics by time
      description: Retrieves call metrics as a time series.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - name: granularity
          in: query
          schema:
            type: string
            enum: [day, week, month]
          description: Time bucket granularity
        - name: assistant_id
          in: query
          schema:
            type: string
          description: Filter by specific assistant
      responses:
        '200':
          description: Time-series analytics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/analytics/calls/by-service:
    get:
      tags: [Analytics]
      summary: Get call analytics by service
      description: Retrieves call metrics grouped by telephony service provider.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Per-service analytics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
