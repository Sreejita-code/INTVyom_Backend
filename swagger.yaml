  /api/passthrough-call/passthrough-outbound:
    post:
      tags: [Passthrough Call]
      summary: Initiate passthrough outbound call
      description: |
        Initiates an outbound call in passthrough mode. The SIP trunk must have
        `passthrough_mode: true` enabled. Returns room token for direct WebSocket connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, trunk_id, to_number]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                trunk_id:
                  type: string
                  description: Local _id or external_trunk_id (must have passthrough_mode=true)
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                to_number:
                  type: string
                  example: "+1234567890"
                metadata:
                  type: object
                  description: Optional call metadata
      responses:
        '200':
          description: Passthrough call initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_token:
                    type: string
                  room_name:
                    type: string
                  queue_id:
                    type: string
                  status:
                    type: string
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Passthrough trunk not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
