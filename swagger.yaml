                    type: string
                  room_name:
                    type: string
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assistant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== PASSTHROUGH CALL ====================
  /api/passthrough-call/passthrough-outbound:
    post:
      tags: [Passthrough Call]
      summary: Initiate passthrough outbound call
      description: |
        Initiates an outbound call in passthrough mode. The SIP trunk must have
        `passthrough_mode: true` enabled. Returns room token for direct WebSocket connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trunk_id, to_number]
              properties:
                trunk_id:
                  type: string
                  description: Local _id or external_trunk_id (must have passthrough_mode=true)
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                to_number:
                  type: string
                  example: "+1234567890"
                metadata:
                  type: object
                  description: Optional call metadata
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Passthrough call initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_token:
                    type: string
                  room_name:
                    type: string
                  queue_id:
                    type: string
                  status:
                    type: string
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Passthrough trunk not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/passthrough-call/call-records:
    get:
      tags: [Passthrough Call]
      summary: Get passthrough call records
      description: >
        Retrieves call records, filtered to passthrough-only calls by default. Set
        `passthrough_only=false` to query across AI calls as well — every record carries
        `is_passthrough` so the two are always distinguishable in a mixed result.
      parameters:
        - name: passthrough_only
          in: query
          schema:
            type: boolean
            default: true
          description: >
            Defaults to `true` on this endpoint. Send `false` to include AI-agent calls.
        - name: to_number
          in: query
          schema:
            type: string
          description: Destination number in E.164 format.
        - name: call_status
          in: query
          schema:
            type: string
            enum: [completed, failed, busy, no_answer, timeout]
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: >
            1-based page number. Replaces the former `offset` parameter, which the external
            API does not read — sending it returned page 1 every time.
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [started_at, ended_at, call_duration_minutes]
            default: started_at
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Call records retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== INBOUND ====================
  /api/inbound/assign:
    post:
      tags: [Inbound]
      summary: Assign assistant to inbound number
      description: |
        Assigns an assistant to handle inbound calls on a specific phone number.

        An assistant is required for the number to route calls. A context strategy is
        optional — without one the call routes normally with no caller-context lookup and
        no added latency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assistant_id, service, inbound_config]
              properties:
                assistant_id:
                  type: string
                  description: Local _id or external_assistant_id
                service:
                  type: string
                  description: Telephony service provider
                inbound_config:
                  type: object
                  required: [phone_number]
                  properties:
                    phone_number:
                      type: string
                      example: "+1234567890"
                inbound_context_strategy_id:
                  type: string
                  description: >-
                    Optional. Local _id or external_strategy_id of an inbound context
                    strategy. Omit to route without any caller-context lookup.
            example:
              assistant_id: 665f1a2b3c4d5e6f7a8b9c0d
              service: exotel
              inbound_config:
                phone_number: '+918044319240'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Inbound assignment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  inbound_id:
                    type: string
                  assistant_id:
                    type: string
                  phone_number:
                    type: string
                  phone_number_normalized:
                    type: string
                  inbound_context_strategy_id:
                    type: string
                    nullable: true
                  inbound_context_strategy_name:
                    type: string
                    nullable: true
        '400':
          description: Missing required fields, unsupported service, or invalid phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assistant or inbound context strategy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Normalized number is already assigned to an active mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/inbound/list:
    get:
      tags: [Inbound]
      summary: List inbound configurations
      description: |
        Retrieves all inbound call configurations. Each entry includes
        `assistant_name` and `inbound_context_strategy_name` resolved for convenience;
        both are null when nothing is attached.
      responses:
        '401':
