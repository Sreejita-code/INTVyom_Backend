  /api/assistant/billable-minutes/{id}:
    get:
      tags: [Assistant]
      summary: Get billable minutes for an assistant
      description: Calculates total billable minutes for a specific assistant and phone number.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: to_number
          in: query
          required: true
          schema:
            type: string
          example: "+1234567890"
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Billable minutes calculated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Total billable minutes calculated successfully"
                  data:
                    type: object
                    properties:
                      assistant_id:
                        type: string
                      to_number:
                        type: string
                      total_billable_minutes:
                        type: number
                        example: 125.5
                        description: >
                          Renamed from total_billable_duration_minutes so this endpoint and
                          platform-billable-minutes use one key for the same quantity.
                      timespan_evaluated:
                        type: object
                        properties:
                          start_date:
                            type: string
                          end_date:
                            type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/platform-billable-minutes:
    get:
      tags: [Assistant]
      summary: Get platform-wise billable minutes
      description: >-
        Calculates billable minutes grouped by platform phone number.

        There is no upstream aggregate for this — it is computed here by reading every call log for
        every assistant you own, so it is the slowest endpoint in the API and its cost grows with
        your history. Always send `start_date` and `end_date`; omitting them evaluates your whole
        lifetime.

        A per-assistant read failure is skipped rather than failing the request, so check
        `data.assistants_skipped` before treating the totals as complete — a non-zero value means
        the numbers are lower than reality, and `message` says so too.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Platform billable minutes retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Platform-wise billable minutes calculated successfully"
                  data:
                    type: object
                    properties:
                      platform_wise_minutes:
                        type: array
                        items:
                          type: object
                          properties:
                            platform_number:
                              type: string
                            total_billable_minutes:
                              type: number
                      timespan_evaluated:
                        type: object
                        properties:
                          start_date:
                            type: string
                          end_date:
                            type: string
                      assistants_evaluated:
                        type: integer
                        description: How many assistants were included in this total.
                        example: 12
                      assistants_skipped:
                        type: integer
                        description: >-
                          How many assistants could not be read and were left out. Anything above 0
                          means the totals are incomplete.
                        example: 0
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/platform-billable-minutes/download:
    get:
      tags: [Assistant]
      summary: Download platform billable minutes as Excel
      description: Downloads an Excel file (.xlsx) with platform-wise billable minutes.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== SIP ====================
  /api/sip/create-outbound-trunk:
    post:
      tags: [SIP]
      summary: Create an outbound SIP trunk
      description: |
        Creates a SIP trunk both locally and externally. Supports Twilio and Exotel trunk types.
        Optionally enables passthrough mode for direct WebSocket connections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, trunk_name, trunk_type, trunk_config]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                trunk_name:
                  type: string
                  example: "Production Twilio Trunk"
                trunk_type:
                  type: string
                  enum: [twilio, exotel]
                  example: "twilio"
                trunk_config:
                  type: object
                  description: |
                    For Twilio: { "address": "string", "numbers": ["string"], "username": "string", "password": "string" }
                    For Exotel: { "exotel_number": "string" }
                  properties:
                    address:
                      type: string
                      example: "pstn.twilio.com"
                    numbers:
                      type: array
                      items:
                        type: string
                      example: ["+1234567890"]
                    username:
                      type: string
                    password:
                      type: string
                    exotel_number:
                      type: string
                passthrough_mode:
                  type: boolean
                  default: false
                passthrough_webhook_url:
                  type: string
                  format: uri
      responses:
        '201':
          description: Outbound trunk created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Outbound trunk created successfully locally and externally"
                  trunk:
                    $ref: '#/components/schemas/SipTrunk'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sip/list:
    get:
      tags: [SIP]
      summary: List SIP trunks
      description: Retrieves all SIP trunks for a user from the local database.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SIP trunks retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "SIP trunks retrieved successfully from local database"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SipTrunk'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sip/details/{id}:
    get:
      tags: [SIP]
      summary: Get SIP trunk details
      description: Retrieves details for a specific SIP trunk by local or external ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SIP trunk details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SipTrunk'
        '404':
          description: SIP trunk not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sip/delete/{id}:
    delete:
      tags: [SIP]
      summary: Delete a SIP trunk
      description: >
        Deactivates the trunk on the external API (`DELETE /sip/deactivate/{trunk_id}`, a
        soft delete that preserves the record for audit) and then removes the local mirror.

        If the external trunk is already gone (404) or already deactivated (400), the local
        row is still removed and `external_deactivated` comes back `false` — otherwise a
        half-finished delete would strand it locally forever. Any other upstream failure
        aborts before the local delete, so the two sides never drift apart.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: Can also be provided in request body
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Alternative to query parameter
      responses:
        '200':
          description: SIP trunk deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "SIP trunk deactivated externally and removed locally"
                  external_deactivated:
                    type: boolean
                    description: >
                      `false` when the external trunk was already inactive or already gone.
                    example: true
                  data:
                    type: object
                    properties:
                      local_id:
                        type: string
                      trunk_id:
                        type: string
                  local_data_removed:
                    type: boolean
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== CALL ====================
  /api/call/outbound:
    post:
      tags: [Call]
      summary: Initiate an outbound call
      description: Initiates an outbound call using an assistant and SIP trunk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, assistant_id, trunk_id, to_number]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                assistant_id:
                  type: string
                  description: Local _id or external_assistant_id
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                trunk_id:
                  type: string
                  description: Local _id or external_trunk_id
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                to_number:
                  type: string
                  example: "+1234567890"
                metadata:
                  type: object
                  description: Optional metadata passed through to the external call API
                  example: {"campaign_id": "promo_2024", "source": "web"}
      responses:
        '200':
          description: Call initiated (external API response)
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/call/queue/{queue_id}:
    get:
      tags: [Call]
      summary: Get outbound queue status
      description: >
        Dispatch state of a queued outbound call. `POST /api/call/outbound` and
        `POST /api/passthrough-call/passthrough-outbound` both return a `queue_id`; this is
        how you resolve it.

        `dispatched` means only that the handoff to the telephony provider succeeded — the
        live call outcome (`answered`, `busy`, `no_answer`, ...) arrives through the end-call
        webhook or the assistant call logs, not here.
      parameters:
        - name: queue_id
          in: path
          required: true
          schema:
            type: string
          description: The queue_id returned when the call was triggered.
          example: "8b7df5ea0fdc497ea4f44bd31954a387"
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      queue_id:
                        type: string
                      status:
                        type: string
                        enum: [pending, dispatching, dispatched, failed]
                        description: >
                          `pending` waiting for the dispatcher; `dispatching` creating the
                          room/provider call; `dispatched` handed off successfully;
                          `failed` permanently failed after retries.
                      to_number:
                        type: string
                      call_service:
                        type: string
                        enum: [twilio, exotel]
                      queued_at:
                        type: string
                        format: date-time
                      dispatched_at:
                        type: string
                        format: date-time
                        nullable: true
                      retry_count:
                        type: integer
                      last_error:
                        type: string
                        nullable: true
        '400':
          description: Missing user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Queue item not found for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== INTEGRATION ====================
  /api/integration/store:
    post:
      tags: [Integration]
      summary: Store integration API key
      description: |
        Saves an API key for a third-party service (TTS or LLM).
        Service type is auto-inferred from the service name if not provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, service_name, api_key]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                service_type:
                  type: string
                  enum: [TTS, LLM, STT]
                  description: >
                    Optional. Derived from `service_name` when omitted, which is the
                    recommended usage — the server's provider map is the source of truth.
                service_name:
                  type: string
                  enum: [sarvam, cartesia, deepgram, elevenlabs, mistral, openai, gemini]
                  example: "sarvam"
                  description: >
                    Which provider this key belongs to. One row per provider, and one row can
                    serve several slots: `sarvam`, `cartesia` and `elevenlabs` each issue a
                    single key covering TTS **and** STT, and `openai` covers the LLM **and**
                    the cascade STT stage. Storing it once is enough, and rotating it re-syncs
                    every slot it backs. `deepgram` is STT-only and is required before an
                    assistant can select `assistant_stt_model: deepgram`.
                    An unrecognised name is rejected with `400`.
                api_key:
                  type: string
                  example: "sk-xxxxxxxxxxxx"
      responses:
        '200':
          description: API key saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Integration API key saved successfully"
                  data:
                    type: object
                    properties:
                      service_type:
                        type: string
                        example: "TTS"
                      service_name:
                        type: string
                        example: "sarvam"
                      api_key_preview:
                        type: string
                        example: "***xxxx"
                  resync:
                    type: object
                    nullable: true
                    description: Re-sync job status if existing assistants were updated
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
                        enum: [running, completed, error, interrupted]
                        description: >
                          `running` while assistants are being re-pushed, `completed` on
                          success, `error` on failure, `interrupted` when the process died
                          mid-job (synthesized on read, never stored).
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/integration/get:
    get:
      tags: [Integration]
      summary: Get integration API key
      description: Retrieves the stored API key for a specific service.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: service_name
          in: query
          required: true
          schema:
            type: string
            enum: [sarvam, cartesia, deepgram, elevenlabs, mistral, openai, gemini]
      responses:
        '200':
          description: API key retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      service_type:
                        type: string
                      service_name:
                        type: string
                      api_key:
                        type: string
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/integration/resync-status:
    get:
      tags: [Integration]
      summary: Get re-sync job status
      description: Retrieves the status of a re-sync job for a user and service.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: service_name
          in: query
          required: true
          schema:
            type: string
            enum: [sarvam, cartesia, deepgram, elevenlabs, mistral, openai, gemini]
      responses:
        '200':
          description: Re-sync status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
                        enum: [running, completed, error, interrupted]
                        description: >
                          `running` while assistants are being re-pushed, `completed` on
                          success, `error` on failure, `interrupted` when the process died
                          mid-job (synthesized on read, never stored).
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No re-sync job found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/integration/resync:
    post:
      tags: [Integration]
      summary: Trigger re-sync for a service
      description: |
        Manually triggers a re-sync to push updated API keys to all existing
        assistants using this provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, service_name]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                service_name:
                  type: string
                  enum: [sarvam, cartesia, deepgram, elevenlabs, mistral, openai, gemini]
                  example: "sarvam"
      responses:
        '202':
          description: Re-sync triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  resync:
                    type: object
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== TOOL ====================
  /api/tool/create:
    post:
      tags: [Tool]
      summary: Create a tool
      description: Creates a tool both locally and externally via the Vyom API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, tool_name, tool_execution_type]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                tool_name:
                  type: string
                  example: "Weather Check"
                tool_description:
                  type: string
                  example: "Fetches current weather for a location"
                tool_execution_type:
                  type: string
                  example: "webhook"
                tool_parameters:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
