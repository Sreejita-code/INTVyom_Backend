            schema:
              type: object
              required: [user_id, name, strategy_config]
              properties:
                user_id:
                  type: string
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                name:
                  type: string
                  example: "Customer Context Strategy"
                type:
                  type: string
                  default: webhook
                  example: "webhook"
                strategy_config:
                  type: object
                  required: [url]
                  properties:
                    url:
                      type: string
                      format: uri
                      example: "https://example.com/webhook/context"
      responses:
        '201':
          description: Strategy created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound-context-strategy/list:
    get:
      tags: [Inbound Context Strategy]
      summary: List inbound context strategies
      description: Retrieves all inbound context strategies.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Strategy list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound-context-strategy/details/{id}:
    get:
      tags: [Inbound Context Strategy]
      summary: Get strategy details
      description: Retrieves details for a specific inbound context strategy.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Strategy details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound-context-strategy/update/{id}:
    patch:
      tags: [Inbound Context Strategy]
      summary: Update a strategy
      description: Updates an inbound context strategy locally and externally.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                name:
                  type: string
                strategy_config:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
      responses:
        '200':
          description: Strategy updated
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound-context-strategy/delete/{id}:
    delete:
      tags: [Inbound Context Strategy]
      summary: Delete a strategy
      description: Deletes an inbound context strategy from both local DB and external API.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: Can also be provided in request body
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: Alternative to query parameter
      responses:
        '200':
          description: Strategy deleted
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

