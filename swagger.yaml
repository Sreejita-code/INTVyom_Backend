            example:
              tool_ids:
              - 880e8400-e29b-41d4-a716-446655449999
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Tools detached
          content:
            application/json:
              schema:
                type: object
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== WEB CALL ====================
  /api/web-call/get-token:
    post:
      tags: [Web Call]
      summary: Get web call token
