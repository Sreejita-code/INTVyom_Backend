                $ref: '#/components/schemas/Error'
        '404':
          description: Inbound mapping, assistant, or strategy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inbound/detach/{id}:
    post:
      tags: [Inbound]
      summary: Detach assistant from inbound
      description: |
        Detaches the assigned assistant from an inbound configuration. Also clears
        `inbound_context_strategy_id`. The mapping stays active and listed.
      parameters:
        - name: id
          in: path
          required: true
