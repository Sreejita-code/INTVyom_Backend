openapi: 3.0.3
info:
  title: INTVoicekit API
  description: |
    Backend API for INTVoicekit, a voice assistant platform (Express + MongoDB). It is a proxy
    in front of the external Vyom LiveKit Agents API: it keeps local records for users,
    assistants, SIP trunks, tools, inbound mappings and integrations, and forwards the work
    upstream on the caller's behalf.

    ## Authentication
    Every endpoint except `POST /api/auth/signup` and `POST /api/auth/login` requires the user's
    upstream LiveKit key, sent as `Authorization: Bearer <api_key>`. A missing or unknown key is
    a `401`. Obtain the key from signup or login. Identity comes from that key — a `user_id` in
    the request body or query string is ignored.

    ## Conventions
    - **Dual ID resolution.** Many `{id}` path params accept either the local MongoDB `_id` or
      the external id (`external_assistant_id`, `external_trunk_id`, ...).
    - **Errors** are always `{ "error": "<message>" }` with the HTTP status (analytics endpoints
      pass the upstream error body through instead). Success bodies vary per endpoint.
    - **Provider API keys** are never taken from a payload. Store them once with
      `POST /api/integration/` (`service_name`: `openai`, `gemini`, `sarvam`, `cartesia`,
      `deepgram`, `elevenlabs`, `mistral`); any `api_key` inside an LLM/TTS/STT config is
      replaced. One vendor key backs every slot it serves (`sarvam`/`cartesia`/`elevenlabs`:
      STT and TTS; `openai`: LLM and cascade STT), and rotating it re-syncs all of them.

    ## Assistant runtime modes (`assistant_mode`, default `pipeline`)
    - `pipeline`: an OpenAI realtime model emits text and a TTS provider speaks it. Needs the
      `assistant_tts_model` + `assistant_tts_config` pair. `gemini` is rejected here.
    - `realtime`: one model (Gemini Live or OpenAI realtime) listens and speaks. TTS/STT fields
      are ignored. Defaults: `provider=gemini`, `model=gemini-3.8-live`, `voice=Puck`.
    - `cascade`: separate STT -> OpenAI chat model -> TTS, each stage metered on its own.

    Model allowlists, voices, per-provider speech config and language-code traps are documented
    on the schemas they constrain: `AssistantLlmConfig`, `AssistantTtsConfig`,
    `AssistantSttConfig`. The end-of-call webhook body is `EndCallWebhookPayload`.
  version: 1.0.0
  contact:
    name: INTVoicekit Support

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://voicekit-api.indusnettechnologies.com
    description: Production server

tags:
  - name: Auth
    description: User authentication and registration
  - name: Assistant
    description: Voice assistant management (CRUD, call logs, billable minutes)
  - name: SIP
    description: SIP trunk management (outbound trunks)
  - name: Call
    description: Outbound call initiation
  - name: Integration
    description: Third-party service integration API key management
  - name: Tool
    description: Tool management and assistant attachment
  - name: Web Call
    description: Web-based call token generation
  - name: Passthrough Call
    description: Passthrough mode outbound calls and records
  - name: Inbound
    description: Inbound call configuration and assignment
  - name: Inbound Context Strategy
    description: Inbound context strategy management (webhooks)
  - name: Analytics
    description: Call analytics and dashboard metrics
  - name: Audio
    description: Audio file upload, listing, and management
  - name: Meeting
    description: Send an assistant into a video meeting (Google Meet)
  - name: Docs
    description: API documentation MCP server — describes this API, never calls it

paths:
  # ==================== AUTH ====================
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new user account with organization details.
      security: [] # public — this is how a caller obtains the bearer key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, org_name, user_email, password]
              properties:
                user_name:
                  type: string
                  description: Login name. Unique across all users and matched exactly (case-sensitive).
                  example: "john_doe"
                org_name:
                  type: string
                  example: "Acme Corp"
                user_email:
                  type: string
                  format: email
                  example: "john@acme.com"
                password:
                  type: string
                  format: password
                  example: "securePass123"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User registered successfully"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "665f1a2b3c4d5e6f7a8b9c0d"
                      user_name:
                        type: string
                        example: "john_doe"
                      user_email:
                        type: string
                        example: "john@acme.com"
                      api_key:
                        type: string
                        nullable: true
                        example: null
        '400':
          description: Validation error, email already registered, or `user_name` already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with credentials
      description: Authenticates a user by username and password.
      security: [] # public — the password is the credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, password]
              properties:
                user_name:
                  type: string
                  example: "john_doe"
                password:
                  type: string
                  format: password
                  example: "securePass123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login successful"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "665f1a2b3c4d5e6f7a8b9c0d"
                      user_name:
                        type: string
                        example: "john_doe"
                      user_email:
                        type: string
                        example: "john@acme.com"
                      api_key:
                        type: string
                        example: "vyom_livekit_xxxxxxxxxxxxxxxx"
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== ASSISTANT ====================
  /api/assistant/create:
    post:
      tags: [Assistant]
      summary: Create a new voice assistant
      description: |
        Creates a voice assistant both locally in MongoDB and externally via the Vyom API.
        Supports runtime modes `pipeline`, `realtime`, and `cascade`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assistant_name, assistant_description, assistant_prompt]
              properties:
                assistant_name:
                  type: string
                  example: "Customer Support Bot"
                assistant_description:
                  type: string
                  example: "Handles inbound customer support queries"
                assistant_prompt:
                  type: string
                  example: "You are a helpful customer support agent..."
                assistant_mode:
                  type: string
                  enum: [pipeline, realtime, cascade]
                  default: pipeline
                  example: "pipeline"
                assistant_llm_config:
                  allOf:
                    - $ref: '#/components/schemas/AssistantLlmConfig'
                    - description: Required when mode=realtime, optional in pipeline.
                assistant_tts_model:
                  type: string
                  description: Required in pipeline mode. Must be sent together with assistant_tts_config.
                  enum: [sarvam, cartesia, elevenlabs, mistral]
                  example: "sarvam"
                assistant_tts_config:
                  $ref: '#/components/schemas/AssistantTtsConfig'
                assistant_stt_model:
                  type: string
                  description: >
                    User-transcription source. `native` (the realtime LLM transcribes itself)
                    is pipeline-only and rejected in cascade. The four plugin providers
                    (`cartesia`, `deepgram`, `elevenlabs`, `openai`) run for real in cascade;
                    in pipeline they are stored but that call falls back to native
                    transcription. `sarvam` runs in both. `realtime` ignores STT fields
                    because the model transcribes directly.
                  enum: [sarvam, native, cartesia, deepgram, elevenlabs, openai]
                  default: sarvam
                assistant_stt_config:
                  $ref: '#/components/schemas/AssistantSttConfig'
                assistant_start_instruction:
                  type: string
                  example: "Greet the user warmly"
                assistant_interaction_config:
                  $ref: '#/components/schemas/AssistantInteractionConfig'
                assistant_end_call_enabled:
                  type: boolean
                  example: false
                assistant_end_call_trigger_phrase:
                  type: string
                  example: "goodbye"
                assistant_end_call_agent_message:
                  type: string
                  example: "Thank you for calling. Goodbye!"
                assistant_end_call_url:
                  type: string
                  format: uri
                  description: >
                    Receives a POST with the full call record when the call ends — body shape
                    is the `EndCallWebhookPayload` schema.
                  example: "https://example.com/webhook/end-call"
                assistant_end_call_webhook:
                  $ref: '#/components/schemas/AssistantEndCallWebhook'
                assistant_greeting_audio:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                    audio_id:
                      type: string
                      example: "audio_123"
            examples:
              pipeline_sarvam:
                summary: Pipeline — OpenAI realtime LLM, Sarvam speech both ways (Hindi)
                value:
                  assistant_name: Support Agent (Hindi)
                  assistant_description: Answers inbound support calls in Hindi
                  assistant_prompt: You are a polite support agent. Keep answers short.
                  assistant_mode: pipeline
                  assistant_llm_config:
                    provider: openai
                    model: gpt-realtime-1.5
                  assistant_tts_model: sarvam
                  assistant_tts_config:
                    speaker: shubh
                    target_language_code: hi-IN
                    pace: 1.0
                  assistant_stt_model: sarvam
                  assistant_stt_config:
                    model: saaras:v3
                    language: unknown
                    mode: codemix
                  assistant_start_instruction: Greet the caller and ask how you can help.
                  assistant_end_call_url: https://example.com/webhooks/call-ended
                  assistant_end_call_webhook:
                    timeout_seconds: 45
                    attempts: 5
              realtime_gemini:
                summary: Realtime — Gemini Live speaks for itself (no TTS/STT fields)
                value:
                  assistant_name: Gemini Concierge
                  assistant_description: Low-latency voice concierge
                  assistant_prompt: You are a friendly concierge.
                  assistant_mode: realtime
                  assistant_llm_config:
                    provider: gemini
                    model: gemini-3.8-live
                    voice: Puck
              cascade_deepgram:
                summary: Cascade — Deepgram STT, OpenAI chat model, Cartesia TTS
                value:
                  assistant_name: Sales Qualifier
                  assistant_description: Qualifies outbound leads
                  assistant_prompt: Ask three qualifying questions, then summarise.
                  assistant_mode: cascade
                  assistant_llm_config:
                    provider: openai
                    model: gpt-4.1-mini
                    temperature: 0.4
                  assistant_stt_model: deepgram
                  assistant_stt_config:
                    model: nova-3
                    language: en-US
                  assistant_tts_model: cartesia
                  assistant_tts_config:
                    voice_id: a167e0f3-df7e-4277-976b-be2f952fa275
                    speed: 1.0
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Assistant created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Assistant created successfully"
                  assistant:
                    $ref: '#/components/schemas/Assistant'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/assistant/list:
    get:
      tags: [Assistant]
      summary: List all assistants
      description: Retrieves a paginated list of assistants from the external API.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
          description: >
            Page size. Defaults to 100 here — deliberately higher than the external API's
            own default of 10, because existing clients expect the full list in one call.
        - name: assistant_name
          in: query
          schema:
            type: string
          description: Case-insensitive partial name filter.
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
          description: ISO-8601 lower bound on assistant creation time.
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
          description: ISO-8601 upper bound on assistant creation time.
        - name: sort_by
          in: query
          schema:
            type: string
            default: assistant_created_at
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Assistant list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assistant'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/assistant/details/{id}:
    get:
      tags: [Assistant]
      summary: Get assistant details
      description: Retrieves details for a specific assistant by local or external ID.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Assistant details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assistant'
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assistant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/assistant/update/{id}:
    patch:
      tags: [Assistant]
      summary: Update an assistant
      description: Updates an assistant locally and on the external Vyom API.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assistant_name:
                  type: string
                assistant_description:
                  type: string
                assistant_prompt:
                  type: string
                assistant_mode:
                  type: string
                  enum: [pipeline, realtime, cascade]
                  description: >
                    Target mode. Only this field (or the presence of TTS/STT fields) switches
                    mode — sending assistant_llm_config alone does NOT, and leaves the stored
                    TTS/STT config untouched.
                assistant_llm_config:
                  allOf:
                    - $ref: '#/components/schemas/AssistantLlmConfig'
                    - description: >
                        Required only when switching into realtime. Safe to send on its own in
                        pipeline mode to rotate api_key or pick gemini.
                assistant_tts_model:
                  type: string
                  enum: [sarvam, cartesia, elevenlabs, mistral]
                  description: >
                    Only required when no TTS config is stored yet. Either half of the TTS pair
                    is enough — the other is filled in from the stored assistant, so changing
                    just the config keeps the model and vice versa. Switching provider without
                    a new config resets to that provider's defaults.
                assistant_tts_config:
                  $ref: '#/components/schemas/AssistantTtsConfig'
                assistant_stt_model:
                  type: string
                  enum: [sarvam, native, cartesia, deepgram, elevenlabs, openai]
                  description: >
                    `native` is pipeline-only and rejected in cascade; `sarvam` is valid in
                    both; `cartesia`, `deepgram`, `elevenlabs` and `openai` run in cascade and
                    are stored-but-inert in pipeline. Sending the model alone resets that
                    provider's config to defaults. Switching an assistant to cascade while it
                    still holds `native` is a 400 — send the new STT model in the same request.
                assistant_stt_config:
                  $ref: '#/components/schemas/AssistantSttConfig'
                assistant_start_instruction:
                  type: string
                assistant_interaction_config:
                  $ref: '#/components/schemas/AssistantInteractionConfig'
                assistant_end_call_enabled:
                  type: boolean
                assistant_end_call_trigger_phrase:
                  type: string
                assistant_end_call_agent_message:
                  type: string
                assistant_end_call_url:
                  type: string
                  format: uri
                  description: >
                    Receives a POST with the full call record when the call ends — body shape
                    is the `EndCallWebhookPayload` schema.
                assistant_end_call_webhook:
                  $ref: '#/components/schemas/AssistantEndCallWebhook'
                assistant_greeting_audio:
                  type: object
            examples:
              rename:
                summary: Rename only — nothing else is re-validated or sent
                value:
                  assistant_name: Support Agent v2
              switch_tts:
                summary: Switch TTS provider — send the new model with its own config
                value:
                  assistant_tts_model: elevenlabs
                  assistant_tts_config:
                    voice_id: JBFqnCBsd6RMkjVDRZzb
                    model: eleven_multilingual_v2
              webhook_attempts:
                summary: Merge one webhook knob — the stored timeout is kept
                value:
                  assistant_end_call_webhook:
                    attempts: 3
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Assistant updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Assistant updated successfully"
                  data:
                    type: object
                    properties:
                      assistant_id:
                        type: string
                  local_data:
                    $ref: '#/components/schemas/Assistant'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/assistant/delete/{id}:
    delete:
      tags: [Assistant]
      summary: Delete an assistant
      description: Deletes an assistant from both local DB and external API.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Assistant deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Assistant deleted successfully"
                  data:
                    type: object
                    properties:
                      assistant_id:
                        type: string
                  local_data_removed:
                    type: boolean
                    example: true
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/assistant/call-logs/{id}:
    get:
      tags: [Assistant]
      summary: Get assistant call logs
      description: Retrieves paginated call logs for a specific assistant.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: page
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Call logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/assistant/billable-minutes/{id}:
    get:
      tags: [Assistant]
      summary: Get billable minutes for an assistant
      description: Calculates total billable minutes for a specific assistant and phone number.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: to_number
          in: query
          required: true
          schema:
            type: string
          example: "+1234567890"
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Billable minutes calculated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Total billable minutes calculated successfully"
                  data:
                    type: object
                    properties:
                      assistant_id:
                        type: string
                      to_number:
                        type: string
                      total_billable_minutes:
                        type: number
                        example: 125.5
                        description: >
                          Renamed from total_billable_duration_minutes so this endpoint and
                          platform-billable-minutes use one key for the same quantity.
                      timespan_evaluated:
                        type: object
                        properties:
                          start_date:
                            type: string
                          end_date:
                            type: string
        '500':
          $ref: '#/components/responses/ServerError'

  /api/assistant/platform-billable-minutes:
    get:
      tags: [Assistant]
      summary: Get platform-wise billable minutes
      description: >-
        Calculates billable minutes grouped by platform phone number.

        There is no upstream aggregate for this — it is computed here by reading every call log for
        every assistant you own, so it is the slowest endpoint in the API and its cost grows with
        your history. Always send `start_date` and `end_date`; omitting them evaluates your whole
        lifetime.

        A per-assistant read failure is skipped rather than failing the request, so check
        `data.assistants_skipped` before treating the totals as complete — a non-zero value means
        the numbers are lower than reality, and `message` says so too.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Platform billable minutes retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Platform-wise billable minutes calculated successfully"
                  data:
                    type: object
                    properties:
                      platform_wise_minutes:
                        type: array
                        items:
                          type: object
                          properties:
                            platform_number:
                              type: string
                            total_billable_minutes:
                              type: number
                      timespan_evaluated:
                        type: object
                        properties:
                          start_date:
                            type: string
                          end_date:
                            type: string
                      assistants_evaluated:
                        type: integer
                        description: How many assistants were included in this total.
                        example: 12
                      assistants_skipped:
                        type: integer
                        description: >-
                          How many assistants could not be read and were left out. Anything above 0
                          means the totals are incomplete.
                        example: 0
        '500':
          $ref: '#/components/responses/ServerError'

  /api/assistant/platform-billable-minutes/download:
    get:
      tags: [Assistant]
      summary: Download platform billable minutes as Excel
      description: Downloads an Excel file (.xlsx) with platform-wise billable minutes.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== SIP ====================
  /api/sip/create-outbound-trunk:
    post:
      tags: [SIP]
      summary: Create an outbound SIP trunk
      description: |
        Creates a SIP trunk both locally and externally. Supports Twilio and Exotel trunk types.
        Optionally enables passthrough mode for direct WebSocket connections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trunk_name, trunk_type, trunk_config]
              properties:
                trunk_name:
                  type: string
                  example: "Production Twilio Trunk"
                trunk_type:
                  type: string
                  enum: [twilio, exotel]
                  example: "twilio"
                trunk_config:
                  type: object
                  description: >
                    Twilio (all required): `address` (your Twilio SIP domain), `numbers` (E.164),
                    `username` (Account SID), `password` (Auth Token). Exotel: `exotel_number`
                    (required, the caller ID) plus optional `sip_host`, `sip_port`, `sip_domain`
                    overrides. Send only the keys for your `trunk_type`.
                  properties:
                    address:
                      type: string
                      example: "example.pstn.twilio.com"
                    numbers:
                      type: array
                      items:
                        type: string
                      example: ["+15550100000"]
                    username:
                      type: string
                    password:
                      type: string
                    exotel_number:
                      type: string
                    sip_host:
                      type: string
                    sip_port:
                      type: number
                    sip_domain:
                      type: string
                passthrough_mode:
                  type: boolean
                  default: false
                passthrough_webhook_url:
                  type: string
                  format: uri
                  description: >
                    Receives a POST with the call record when the call ends — body shape is the
                    `EndCallWebhookPayload` schema (no `usage`, empty `transcripts`).
            examples:
              twilio:
                summary: Twilio trunk
                value:
                  trunk_name: Twilio Production
                  trunk_type: twilio
                  trunk_config:
                    address: example.pstn.twilio.com
                    numbers:
                    - '+15550100000'
                    username: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                    password: your_auth_token_here
              exotel:
                summary: Exotel trunk
                value:
                  trunk_name: Exotel India
                  trunk_type: exotel
                  trunk_config:
                    exotel_number: '+918044319240'
              passthrough:
                summary: Passthrough trunk (human-to-SIP, no AI agent)
                value:
                  trunk_name: Human Agent Trunk
                  trunk_type: twilio
                  trunk_config:
                    address: example.pstn.twilio.com
                    numbers:
                    - '+15550100000'
                    username: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                    password: your_auth_token_here
                  passthrough_mode: true
                  passthrough_webhook_url: https://your-app.com/webhooks/call-ended
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Outbound trunk created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Outbound trunk created successfully locally and externally"
                  trunk:
                    $ref: '#/components/schemas/SipTrunk'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/sip/list:
    get:
      tags: [SIP]
      summary: List SIP trunks
      description: Retrieves all SIP trunks for a user from the local database.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: SIP trunks retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "SIP trunks retrieved successfully from local database"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SipTrunk'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/sip/details/{id}:
    get:
      tags: [SIP]
      summary: Get SIP trunk details
      description: Retrieves details for a specific SIP trunk by local or external ID.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: SIP trunk details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SipTrunk'
        '404':
          description: SIP trunk not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/sip/delete/{id}:
    delete:
      tags: [SIP]
      summary: Delete a SIP trunk
      description: >
        Deactivates the trunk on the external API (`DELETE /sip/deactivate/{trunk_id}`, a
        soft delete that preserves the record for audit) and then removes the local mirror.

        If the external trunk is already gone (404) or already deactivated (400), the local
        row is still removed and `external_deactivated` comes back `false` — otherwise a
        half-finished delete would strand it locally forever. Any other upstream failure
        aborts before the local delete, so the two sides never drift apart.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: SIP trunk deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "SIP trunk deactivated externally and removed locally"
                  external_deactivated:
                    type: boolean
                    description: >
                      `false` when the external trunk was already inactive or already gone.
                    example: true
                  data:
                    type: object
                    properties:
                      local_id:
                        type: string
                      trunk_id:
                        type: string
                  local_data_removed:
                    type: boolean
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== CALL ====================
  /api/call/outbound:
    post:
      tags: [Call]
      summary: Initiate an outbound call
      description: Initiates an outbound call using an assistant and SIP trunk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assistant_id, trunk_id, to_number]
              properties:
                assistant_id:
                  type: string
                  description: Local _id or external_assistant_id
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                trunk_id:
                  type: string
                  description: Local _id or external_trunk_id
                  example: "665f1a2b3c4d5e6f7a8b9c0d"
                to_number:
                  type: string
                  example: "+1234567890"
                metadata:
                  type: object
                  description: Optional metadata passed through to the external call API
                  example: {"campaign_id": "promo_2024", "source": "web"}
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Call initiated (external API response)
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/call/queue/{queue_id}:
    get:
      tags: [Call]
      summary: Get outbound queue status
      description: >
        Dispatch state of a queued outbound call. `POST /api/call/outbound` and
        `POST /api/passthrough-call/passthrough-outbound` both return a `queue_id`; this is
        how you resolve it.

        `dispatched` means only that the handoff to the telephony provider succeeded — the
        live call outcome (`answered`, `busy`, `no_answer`, ...) arrives through the end-call
        webhook or the assistant call logs, not here.
      parameters:
        - name: queue_id
          in: path
          required: true
          schema:
            type: string
          description: The queue_id returned when the call was triggered.
          example: "8b7df5ea0fdc497ea4f44bd31954a387"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Queue status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      queue_id:
                        type: string
                      status:
                        type: string
                        enum: [pending, dispatching, dispatched, failed]
                        description: >
                          `pending` waiting for the dispatcher; `dispatching` creating the
                          room/provider call; `dispatched` handed off successfully;
                          `failed` permanently failed after retries.
                      to_number:
                        type: string
                      call_service:
                        type: string
                        enum: [twilio, exotel]
                      queued_at:
                        type: string
                        format: date-time
                      dispatched_at:
                        type: string
                        format: date-time
                        nullable: true
                      retry_count:
                        type: integer
                      last_error:
                        type: string
                        nullable: true
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Queue item not found for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== INTEGRATION ====================
  /api/integration/store:
    post:
      tags: [Integration]
      summary: Store integration API key
      description: |
        Saves an API key for a third-party service (TTS or LLM).
        Service type is auto-inferred from the service name if not provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_name, api_key]
              properties:
                service_type:
                  type: string
                  enum: [TTS, LLM, STT]
                  description: >
                    Optional. Derived from `service_name` when omitted, which is the
                    recommended usage — the server's provider map is the source of truth.
                service_name:
                  type: string
                  enum: [sarvam, cartesia, deepgram, elevenlabs, mistral, openai, gemini]
                  example: "sarvam"
                  description: >
                    Which provider this key belongs to. One row per provider, and one row can
                    serve several slots: `sarvam`, `cartesia` and `elevenlabs` each issue a
                    single key covering TTS **and** STT, and `openai` covers the LLM **and**
                    the cascade STT stage. Storing it once is enough, and rotating it re-syncs
                    every slot it backs. `deepgram` is STT-only and is required before an
                    assistant can select `assistant_stt_model: deepgram`.
                    An unrecognised name is rejected with `400`.
                api_key:
                  type: string
                  example: "sk-xxxxxxxxxxxx"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: API key saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Integration API key saved successfully"
                  data:
                    type: object
                    properties:
                      service_type:
                        type: string
                        example: "TTS"
                      service_name:
                        type: string
                        example: "sarvam"
                      api_key_preview:
                        type: string
                        example: "***xxxx"
                  resync:
                    type: object
                    nullable: true
                    description: Re-sync job status if existing assistants were updated
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
                        enum: [running, completed, error, interrupted]
                        description: >
                          `running` while assistants are being re-pushed, `completed` on
                          success, `error` on failure, `interrupted` when the process died
                          mid-job (synthesized on read, never stored).
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/integration/get:
    get:
      tags: [Integration]
      summary: Get integration API key
      description: Retrieves the stored API key for a specific service.
      parameters:
        - name: service_name
          in: query
          required: true
          schema:
            type: string
            enum: [sarvam, cartesia, deepgram, elevenlabs, mistral, openai, gemini]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: API key retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      service_type:
                        type: string
                      service_name:
                        type: string
                      api_key:
                        type: string
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/integration/resync-status:
    get:
      tags: [Integration]
      summary: Get re-sync job status
      description: Retrieves the status of a re-sync job for a user and service.
      parameters:
        - name: service_name
          in: query
          required: true
          schema:
            type: string
            enum: [sarvam, cartesia, deepgram, elevenlabs, mistral, openai, gemini]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Re-sync status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
                        enum: [running, completed, error, interrupted]
                        description: >
                          `running` while assistants are being re-pushed, `completed` on
                          success, `error` on failure, `interrupted` when the process died
                          mid-job (synthesized on read, never stored).
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No re-sync job found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/integration/resync:
    post:
      tags: [Integration]
      summary: Trigger re-sync for a service
      description: |
        Manually triggers a re-sync to push updated API keys to all existing
        assistants using this provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_name]
              properties:
                service_name:
                  type: string
                  enum: [sarvam, cartesia, deepgram, elevenlabs, mistral, openai, gemini]
                  example: "sarvam"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '202':
          description: Re-sync triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  resync:
                    type: object
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== TOOL ====================
  /api/tool/create:
    post:
      tags: [Tool]
      summary: Create a tool
      description: Creates a tool both locally and externally via the Vyom API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_name, tool_description, tool_execution_type, tool_execution_config]
              properties:
                tool_name:
                  type: string
                  pattern: '^[a-z][a-z0-9_]*$'
                  maxLength: 100
                  description: >
                    snake_case. Keep it at 64 characters or fewer: the field accepts 100, but
                    OpenAI rejects longer names and such a tool is skipped at call time.
                  example: "lookup_weather"
                tool_description:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: What the tool does, written for the LLM.
                  example: "Get current weather information for a given location"
                tool_execution_type:
                  type: string
                  enum: [webhook, static_return]
                  example: "webhook"
                tool_parameters:
                  type: array
                  description: >
                    In `cascade` mode a tool is sent to OpenAI with a strict schema only when
                    every parameter is a required scalar (`string`, `number`, `boolean`). Any
                    optional or `object`/`array` parameter turns strict off for that tool.
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [string, number, boolean, object, array]
                      description:
                        type: string
                      required:
                        type: boolean
                        default: true
                      enum:
                        type: array
                        description: Allowed values, string parameters only.
                        items:
                          type: string
                  default: []
                tool_execution_config:
                  type: object
                  description: >
                    `webhook`: `url` (required), `timeout` (seconds, default 10), `headers`. The
                    tool call is always a POST — there is no method field. `static_return`:
                    `value` (required; any JSON value), returned as-is.
                  properties:
                    url:
                      type: string
                      format: uri
                    timeout:
                      type: number
                      default: 10
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                    value:
                      description: static_return only. Any JSON value.
            examples:
              webhook:
                summary: Webhook tool
                value:
                  tool_name: lookup_weather
                  tool_description: Get current weather information for a given location
                  tool_parameters:
                  - name: location
                    type: string
                    description: City and state, e.g. San Francisco, CA
                    required: true
                  tool_execution_type: webhook
                  tool_execution_config:
                    url: https://api.weather.com/v1/current
                    timeout: 5
                    headers:
                      Authorization: Bearer weather_api_token
              static_return:
                summary: Static return tool
                value:
                  tool_name: get_support_email
                  tool_description: Get the customer support email address
                  tool_execution_type: static_return
                  tool_execution_config:
                    value: support@example.com
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Tool created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tool_id:
                        type: string
        '500':
          $ref: '#/components/responses/ServerError'

  /api/tool/list:
    get:
      tags: [Tool]
      summary: List tools
      description: Retrieves all tools from the external API.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Tool list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
          $ref: '#/components/responses/ServerError'

  /api/tool/details/{id}:
    get:
      tags: [Tool]
      summary: Get tool details
      description: Retrieves details for a specific tool.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Tool details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '500':
          $ref: '#/components/responses/ServerError'

  /api/tool/update/{id}:
    patch:
      tags: [Tool]
      summary: Update a tool
      description: Updates a tool on the external API.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool_name:
                  type: string
                tool_description:
                  type: string
                tool_execution_type:
                  type: string
                tool_parameters:
                  type: array
                  items:
                    type: object
                tool_execution_config:
                  type: object
            example:
              tool_description: Get current weather, in Celsius, for a given city
