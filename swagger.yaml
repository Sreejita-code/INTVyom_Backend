          $ref: '#/components/responses/ServerError'

  /api/inbound/update/{id}:
    patch:
      tags: [Inbound]
      summary: Update inbound configuration
      description: |
        Updates an inbound configuration. Send `assistant_id`,
        `inbound_context_strategy_id`, or both — at least one is required.

        Pass `null` for either field to detach it. Detaching the strategy leaves the
        number routing normally, without caller-context lookup.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assistant_id:
                  type: string
                  nullable: true
                  description: Local _id or external id. Pass null to detach the assistant.
                inbound_context_strategy_id:
                  type: string
                  nullable: true
                  description: >-
                    Local _id or external_strategy_id. Pass null to detach the strategy.
            examples:
              reassign:
                summary: Point the number at another assistant
                value:
                  assistant_id: 665f1a2b3c4d5e6f7a8b9c0e
              detach_strategy:
                summary: Detach the context strategy, keep the assistant
                value:
                  inbound_context_strategy_id: null
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Inbound updated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: No updatable field provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Inbound mapping, assistant, or strategy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/inbound/detach/{id}:
