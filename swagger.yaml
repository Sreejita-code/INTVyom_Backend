                  example: ["665f1a2b3c4d5e6f7a8b9c0d", "665f1a2b3c4d5e6f7a8b9c0e"]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Tools attached
          content:
            application/json:
              schema:
                type: object
        '500':
